<title>AGIWM Flyer Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Anton&family=Bebas+Neue&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:wght@500;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Lora:wght@500;700&family=Montserrat:wght@500;600;700;800;900&family=Noto+Sans+Telugu:wght@500;700;900&family=Noto+Serif+Telugu:wght@500;700;900&family=Oswald:wght@500;700&family=Pacifico&family=Playfair+Display:wght@800;900&family=Poppins:wght@500;600;700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout follows Slides Studio: top bar, floating tool and format bars over a dark canvas, flyer thumbnails in a strip below. One committed dark look. */
:root{
  --ui-bg:#171716; --ui-panel:#171716; --ui-raise:#1f1e1d; --ui-line:#32302d;
  --ui-text:#ece9e4; --ui-dim:#98938b; --ui-accent:#3d82f6; --ui-danger:#e5484d;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ui-bg);color:var(--ui-text);font:14px/1.4 var(--ui)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 48px auto;height:100%;overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ui-line);background:var(--ui-panel);min-width:0}
.title-in{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-weight:600;font-size:15px;min-width:90px;max-width:46vw;width:240px}
.title-in:hover{border-color:var(--ui-line)} .title-in:focus{border-color:var(--ui-accent);outline:none;background:var(--ui-bg)}
.dim{color:var(--ui-dim);font-size:12.5px;white-space:nowrap} .grow{flex:1}
.btn{border:1px solid var(--ui-line);background:var(--ui-raise);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#3b4553}
.btn[disabled]{opacity:.5;cursor:progress}
.btn.primary{background:#f4f2ee;color:#17161a;border-color:#f4f2ee;display:inline-flex;align-items:center;gap:8px}
.btn.primary:hover{background:#fff}
.btn.primary2{display:inline-flex;align-items:center;gap:8px}
.ico{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border:0;border-radius:8px;background:transparent;cursor:pointer;gap:6px;grid-auto-flow:column}
.ico:hover{background:#ffffff14} .ico:disabled{opacity:.35;cursor:default;background:transparent}
.ico[aria-pressed="true"]{background:#3d82f626;color:var(--ui-accent)}
.ico .lbl{font-size:12.5px;font-weight:600}
.vsep{width:1px;height:22px;background:var(--ui-line);margin:0 4px;flex:none}

/* workspace */
#workspace{display:flex;min-height:0;position:relative}
#canvasWrap{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#viewport{flex:1;min-height:0;overflow:auto;display:flex;padding:28px}
#stageBox{margin:auto;flex:none;position:relative;box-shadow:0 24px 70px #0007;border-radius:2px;overflow:hidden}
.selz{background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:5px 8px;height:30px;cursor:pointer}
#zoomSel{width:84px}

/* format bar fields */
.cf{display:inline-flex;align-items:center;gap:6px;padding:0 4px;min-width:0}
.cf>span{font-size:12px;color:var(--ui-dim);white-space:nowrap}
.cf input[type=text],.cf input[type=date],.cf select{background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:5px 8px;height:30px;min-width:0}
.cf input[type=text]{width:190px}
.cf input[type=date]{width:136px;color-scheme:dark}
.cf input[type=color]{width:34px;height:30px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-bg);padding:2px;cursor:pointer}
.cf input[type=range]{width:96px;accent-color:var(--ui-accent);cursor:pointer}
.cf .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500}
.cf .chk input{width:16px;height:16px;accent-color:var(--ui-accent)}
.cf .sbtn{border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:8px;height:30px;padding:0 12px;cursor:pointer;font-weight:600}
.cf .sbtn:hover{border-color:#4a4743} .cf .sbtn[disabled]{opacity:.4;cursor:default}
.cf .th{width:28px;height:28px;border-radius:6px;border:1px solid var(--ui-line);background:#2b2927 center/cover no-repeat}
.fname{font-weight:700;padding:0 8px;white-space:nowrap}

/* bottom bar */
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--ui-line);background:var(--ui-panel)}
.bottom .grp{display:flex;align-items:center;gap:4px} .bottom .right{justify-content:flex-end}
#counter{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ui-dim)}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-raise)}
.seg .ico{min-width:30px;height:28px}
#strip{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--ui-line);position:relative}
#strip.off{display:none}
.tw{position:relative;display:block;border-radius:8px;cursor:pointer;width:240px;flex:none}
.tw .thumb{position:relative;overflow:hidden;border-radius:7px;border:1px solid var(--ui-line);background:var(--ui-raise);width:240px;height:135px}
.tw .snap{position:absolute;left:0;top:0;width:2000px;height:1125px;transform:scale(.12);transform-origin:0 0;pointer-events:none}
.tw.on .thumb{outline:2px solid var(--ui-accent);outline-offset:1px}
.tw .tnum{position:absolute;left:5px;bottom:5px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-size:10.5px;font-weight:600;line-height:1;color:#fff;background:rgba(15,15,14,.7);border-radius:5px}
.tw.on .tnum{background:rgba(61,130,246,.88)}
.tw .tact{position:absolute;right:5px;top:5px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:2}
.tw:hover .tact,.tw:focus-within .tact{opacity:1}
.tw .tact button{width:22px;height:22px;display:grid;place-items:center;padding:0;border:0;border-radius:6px;cursor:pointer;color:#fff;background:rgba(15,15,14,.6)}
.tw .tact button:hover{background:rgba(15,15,14,.9)} .tw .tact button.danger:hover{background:rgba(229,72,77,.92)}
.tw .tact svg.i{width:14px;height:14px}
@media (hover:none){.tw .tact{opacity:1}}

/* popup menus */
.pop{position:fixed;z-index:60;background:var(--ui-raise);border:1px solid var(--ui-line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 14px 44px #000a}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.mi:hover{background:#ffffff14} .mi .hint{margin-left:auto;color:var(--ui-dim);font-size:12px;padding-left:16px}
.pop hr{border:0;border-top:1px solid var(--ui-line);margin:6px 0}

/* settings sheet (all fields) */
#dock{display:flex;flex-direction:row-reverse;order:-1;width:392px;flex:none;border-right:1px solid var(--ui-line);background:var(--ui-panel);min-height:0}
#panel{flex:1;min-width:0;overflow:auto;padding-bottom:24px}
#rail{width:54px;flex:none;border-right:1px solid var(--ui-line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow:auto}
#rail .ico{width:40px;height:40px;border-radius:10px}
#rail .rsp{height:1px;width:28px;background:var(--ui-line);margin:6px 0;flex:none}
#rail .grow{flex:1}
#props{border-bottom:1px solid var(--ui-line);padding-bottom:14px}
#props .phd{display:flex;align-items:center;gap:4px;padding:8px 10px;position:sticky;top:0;background:var(--ui-panel);z-index:2;border-bottom:1px solid var(--ui-line)}
#props .phd .fname{flex:1;padding:0 4px}
#props .empty{padding:18px 16px;color:var(--ui-dim)}
#props .fields{padding:12px 14px 0;grid-template-columns:1fr}
.dockhead{padding:14px 16px 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-dim);font-weight:600}
#panel .unused{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px max(16px,0px);position:sticky;top:0;background:var(--ui-panel);z-index:2;border-bottom:1px solid var(--ui-line);font-weight:700}
#panel details{margin:10px 12px 0;background:var(--ui-raise);border:1px solid var(--ui-line);border-radius:12px}
#panel summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
#panel summary::-webkit-details-marker{display:none}
#panel summary::after{content:"+";color:var(--ui-dim);font-size:18px;line-height:1}
#panel details[open] summary::after{content:"\2212"}
.fields{padding:2px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0} .fld.full{grid-column:1/-1}
.fld>label,.fld>.lab{font-size:11.5px;color:var(--ui-dim)}
.fld input[type=text],.fld input[type=date],.fld select{width:100%;border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:8px;padding:7px 10px;min-width:0;height:34px}
.fld input[type=date]{color-scheme:dark}
.fld input[type=color]{width:100%;height:34px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-bg);padding:2px}
.fld input[type=range]{width:100%;accent-color:var(--ui-accent)}
.fld .chk{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.fld .chk input{width:17px;height:17px;accent-color:var(--ui-accent)}
.imgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumb2{width:40px;height:40px;border-radius:8px;border:1px solid var(--ui-line);background:#2b2927 center/cover no-repeat}
.swrow{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}
.sw:hover{border-color:#fff}
.hint{grid-column:1/-1;font-size:12.5px;color:var(--ui-dim);margin:0}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f4f2ee;color:#17161a;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ov img{max-width:100%;max-height:78vh;border-radius:8px;background:#fff}
.ov p{color:#fff;margin:0;text-align:center}
#present{position:fixed;inset:0;background:#000;z-index:75;display:flex;align-items:center;justify-content:center;cursor:pointer}
#present .pw{position:relative;overflow:hidden}
#present .pi{position:absolute;left:0;top:0;width:2000px;height:1125px;transform-origin:0 0}

#ttl,#sub,#loc,#scr,#hd,#tags span,.plate .nm,.plate .pl,.plate .lb,.tm,#zl,#zid b,#zpw b,#yl,#yh,#jt{cursor:text}
#stage [contenteditable]{outline:3px solid #3d82f6;outline-offset:6px;min-width:20px;text-transform:none;border-radius:4px}
#selbox{position:absolute;pointer-events:none;border:3px solid #3d82f6;border-radius:6px;z-index:50;display:none}
.phw .ph{will-change:transform}

/* ---------- AI assistant ---------- */
#panel.ai-on>#props,#panel.ai-on>.dockhead,#panel.ai-on>#sheetBody{display:none}
#aiPane{display:none;flex-direction:column;height:100%;min-height:0}
#panel.ai-on{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
#panel.ai-on #aiPane{display:flex;flex:1;min-height:0}
#aiPane .ahd{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--ui-line)}
#aiPane .ahd .fname{flex:1;font-weight:600;padding-left:6px}
#aiLog{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#aiLog .m{max-width:94%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
#aiLog .m.me{align-self:flex-end;background:#3d82f633;border:1px solid #3d82f655}
#aiLog .m.bot{align-self:flex-start;background:var(--ui-raise);border:1px solid var(--ui-line)}
#aiLog .m.bad{border-color:var(--ui-danger);color:#ffb4b6}
#aiLog .m.note{align-self:center;color:var(--ui-dim);font-size:12.5px;background:none;border:0;text-align:center}
#aiLog .chg{margin-top:6px;font-size:12.5px;color:var(--ui-dim)}
#aiLog .chg button{margin-left:8px;border:1px solid var(--ui-line);background:var(--ui-bg);color:var(--ui-text);border-radius:7px;padding:2px 9px;cursor:pointer}
#aiChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
#aiChips button{border:1px solid var(--ui-line);background:var(--ui-raise);color:var(--ui-text);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:12.5px}
#aiChips button:hover{border-color:var(--ui-accent)}
#aiForm{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--ui-line);align-items:flex-end}
#aiIn{flex:1;resize:none;min-height:40px;max-height:140px;background:var(--ui-bg);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:10px;padding:9px 11px;font:inherit}
#aiIn:focus{outline:none;border-color:var(--ui-accent)}
#aiSetup{padding:18px 16px;color:var(--ui-dim)}
#aiSetup .btn{margin-top:10px;color:var(--ui-text)}
dialog.aid{background:var(--ui-raise);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:14px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 20px 60px #000b}
dialog.aid::backdrop{background:#000a}
dialog.aid h2{margin:0 0 6px;font-size:18px}
dialog.aid .nt{color:var(--ui-dim);font-size:12.5px;margin:0 0 12px}
dialog.aid label{display:block;margin:0 0 10px}
dialog.aid label>span{display:block;font-size:12px;color:var(--ui-dim);margin-bottom:4px}
dialog.aid input,dialog.aid select{width:100%;box-sizing:border-box;background:var(--ui-bg);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:8px;padding:8px 10px;font:inherit}
dialog.aid .st{min-height:20px;font-size:12.5px;color:var(--ui-dim);margin:2px 0 10px}
dialog.aid .st[data-k=ok]{color:#6bd98a} dialog.aid .st[data-k=bad]{color:#ff8b8e}
dialog.aid .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog.aid .acts .btn{color:var(--ui-text)} dialog.aid .acts .btn.primary{color:#17161a}

/* ---------- live link ---------- */
#liveBtn{display:none;align-items:center;gap:7px;border:1px solid var(--ui-line);background:var(--ui-raise);color:var(--ui-text);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
#liveBtn.show{display:inline-flex}
#liveBtn i{width:8px;height:8px;border-radius:50%;background:#6b6760;display:inline-block}
#liveBtn[data-s=on] i{background:#38d27a;box-shadow:0 0 0 3px #38d27a33}
#liveBtn[data-s=wait] i{background:#f0b429}
#liveBtn[data-s=bad] i{background:var(--ui-danger)}
#liveBtn.ping{animation:lp .9s ease-out}
@keyframes lp{0%{box-shadow:0 0 0 0 #3d82f6aa}100%{box-shadow:0 0 0 14px #3d82f600}}
#liveFeed{position:fixed;z-index:70;top:54px;right:12px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--ui-raise);border:1px solid var(--ui-line);border-radius:14px;box-shadow:0 14px 44px #000a;padding:12px 14px;display:none}
#liveFeed.on{display:block}
#liveFeed h3{margin:0 0 4px;font-size:14px}
#liveFeed .nt{color:var(--ui-dim);font-size:12.5px;margin:0 0 10px}
#liveFeed .ent{border-top:1px solid var(--ui-line);padding:8px 0;font-size:13px;word-break:break-word}
#liveFeed .ent b{color:var(--ui-accent);font-weight:600} #liveFeed .ent small{display:block;color:var(--ui-dim);font-size:11.5px;margin-top:2px}
#liveFeed .acts{display:flex;gap:8px;margin-top:10px}
#liveFeed .acts .btn{color:var(--ui-text);font-size:13px;padding:5px 11px}

@media (max-width:760px){
  .title-in{width:150px}
  .dim.stat{display:none}
  #workspace{flex-direction:column}
  #viewport{padding:14px}
  #dock{order:0;width:auto;height:46vh;border-right:0;border-top:1px solid var(--ui-line);flex-direction:column-reverse}
  #rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--ui-line);padding:6px 10px;overflow-x:auto;overflow-y:hidden}
  #rail .ico{flex:none}
  #rail .rsp{width:1px;height:26px;margin:0 6px}
  #rail .grow{display:none}
  #zoomSel{width:70px}
  .bottom{grid-template-columns:auto 1fr auto}
  .btn.primary .lbl{display:none}
}


/* Photoshop layout: toolbox far left, canvas centre, layers + options right */
#layers{display:none}
@media (min-width:761px){
  html.ps #dock{display:contents}
  html.ps #rail{order:-1;width:46px;background:#0f0f0e;padding:8px 0}
  html.ps #rail .ico{width:34px;height:34px;border-radius:6px}
  html.ps #panel{order:1;width:340px;flex:none;border-left:1px solid var(--ui-line);background:#1c1c1b}
  html.ps #canvasWrap{background:#0b0b0a}
  html.ps #layers{display:block;border-bottom:1px solid var(--ui-line);padding:0 0 6px}
  html.ps #panel.ai-on #layers{display:none}
  html.ps .top{background:#0f0f0e}
}
#layers .lh{padding:8px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-dim);background:#141413;border-bottom:1px solid var(--ui-line)}
#layers .lr{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border:0;background:transparent;color:var(--ui-text);font:inherit;font-size:13px;text-align:left;cursor:pointer;border-bottom:1px solid #262523}
#layers .lr:hover{background:#242321} #layers .lr[aria-current=true]{background:#2f3b57}
#layers .lr .ey{width:16px;height:16px;flex:none;accent-color:#6b8cff}
#layers .lr .ty{width:18px;color:var(--ui-dim);text-align:center;font-weight:700;font-size:12px}
#layers .lr.off{opacity:.5}
#layers .ls{max-height:250px;overflow:auto}

/* Floating layout (D): full canvas, bottom pill toolbar, floating cards */
#pill{display:none}
html.fd #rail,html.fd .dockhead,html.fd #sheetBody,html.fd #stripTog{display:none}
html.fd #dock{display:contents}
html.fd #canvasWrap{padding-bottom:78px}
@media (min-width:761px){html.fd.fdp #canvasWrap{padding-right:350px}}
html.fd #panel{display:none;position:fixed;right:14px;top:62px;bottom:136px;width:330px;border:1px solid #33353b;border-radius:14px;background:#1d1e22;box-shadow:0 10px 40px #000a;z-index:30;overflow:auto;padding-bottom:10px}
html.fd.fdp #panel{display:block}
html.fd.fdp #panel.ai-on{display:flex}
html.fd #layers{display:none;border-bottom:1px solid var(--ui-line)} html.fd.fdl #layers{display:block}
html.fd #panel.ai-on #layers{display:none}
html.fd #strip{display:none;position:fixed;left:12px;right:12px;bottom:136px;z-index:29;border:1px solid #33353b;border-radius:14px;background:#1d1e22;box-shadow:0 10px 40px #000a;padding:10px 12px}
html.fd.fds #strip{display:flex}
html.fd #pill{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:54px;z-index:31;gap:2px;padding:6px 8px;background:#1d1e22;border:1px solid #33353b;border-radius:18px;box-shadow:0 10px 40px #000a}
#pill button{border:0;background:transparent;color:#9a9aa2;font:inherit;font-size:10px;width:62px;padding:5px 0;border-radius:12px;cursor:pointer}
#pill button b{display:block;font-size:18px;font-weight:400;color:#ddd;line-height:1.2}
#pill button[aria-pressed=true]{background:#2f3b57;color:#fff} #pill button:hover{background:#26272c}
@media (max-width:760px){
  html.fd #panel{left:8px;right:8px;top:auto;bottom:136px;width:auto;height:42vh}
  html.fd #pill{width:calc(100vw - 16px);justify-content:space-around;padding:5px 2px}#pill button{width:auto;flex:1;font-size:9px}
  html.fd #canvasWrap{padding-bottom:96px}

/* ---------- The flyer (fixed 2000 x 1125 canvas) ---------- */
#stage{position:absolute;left:0;top:0;width:2000px;height:1125px;overflow:hidden;transform-origin:0 0;font-family:Montserrat,'Segoe UI',Arial,sans-serif;color:#1c1415;
  --maroon:#7d1226;--maroon2:#96243b;--gold:#c9a15a;--ink:#1c1415}
#stage *{box-sizing:border-box}
#stage .abs{position:absolute}
#stage .ctr{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}
.bgbase{position:absolute;inset:0;background:
  radial-gradient(circle at 0% 62%,rgba(112,148,86,.55) 0,rgba(112,148,86,0) 17%),
  radial-gradient(circle at 100% 16%,rgba(104,140,78,.55) 0,rgba(104,140,78,0) 17%),
  radial-gradient(circle at 100% 88%,rgba(150,170,110,.35) 0,rgba(150,170,110,0) 12%),
  radial-gradient(ellipse at 50% 45%,#fffaf4 0,#f2e6da 75%)}
.bgimg{position:absolute;inset:0;background:center/cover no-repeat}
.bgveil{position:absolute;inset:0}
.bgglow{position:absolute;inset:0}
#logo{left:88px;top:8px;width:304px;height:304px;border-radius:50%;background:center/contain no-repeat;box-shadow:0 6px 18px rgba(80,30,30,.25)}
#ttl{font-weight:900;color:var(--maroon);line-height:1;letter-spacing:.01em;display:inline-block}
#sub{font-weight:600;color:#3a2c2e;letter-spacing:.17em;display:inline-block;line-height:1}
.locrow{display:flex;align-items:center;gap:26px}
.locrow i{display:block;width:262px;height:2px;background:var(--gold)}
#loc{font-weight:600;color:#3a2c2e;letter-spacing:.42em;line-height:1;padding-left:.42em;display:inline-block}
#scr{font-family:'Great Vibes','Brush Script MT',cursive;color:var(--maroon);line-height:1.1;display:inline-block;padding:0 .06em}
#scr .ht{display:inline-block;width:.2em;height:.2em;margin:0 .03em;vertical-align:top;position:relative;top:.2em}
#scr .ht svg{display:block;width:100%;height:100%}
#hd{font-family:'Playfair Display',Georgia,serif;font-weight:900;color:#1b1214;line-height:1;letter-spacing:.01em;display:inline-block}
#hd .w{display:inline-block;margin:0 .1em}
#hd .c1{font-size:1em}#hd .c2{font-size:.78em}
.tagrow{display:flex;align-items:center;font-weight:500;letter-spacing:.12em;color:#3c2f31;line-height:1;white-space:nowrap}
.tagrow i{display:block;width:2px;height:1.05em;background:var(--gold);margin:0 1.3em}
.card{position:absolute;border-radius:30px;overflow:hidden;border:4px solid var(--gold);background:#d9b99a;box-shadow:0 10px 26px rgba(90,40,30,.28)}
.phw{position:absolute;inset:0;overflow:hidden;cursor:grab}
.phw.drag{cursor:grabbing}
.ph{position:absolute;inset:0;background:center/cover no-repeat;transform-origin:50% 50%}
.phe{position:absolute;inset:0;background:linear-gradient(180deg,#e7c9a8,#caa07a);display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.phe svg{width:62%}
.plate{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;text-align:center;background:linear-gradient(180deg,var(--maroon2),var(--maroon));color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.plate .lb{font-family:'Great Vibes',cursive;font-size:38px;line-height:1;color:#f6e3c4;letter-spacing:.02em}
.plate .nm{font-weight:800;font-size:35px;line-height:1.12;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;display:inline-block}
.plate .pl{font-weight:600;font-size:33px;line-height:1.1;white-space:nowrap;display:inline-block}
.chip{position:absolute;top:12px;right:12px;border:0;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:600 24px/1 Figtree,sans-serif;padding:10px 18px;cursor:pointer}
.dcard{position:absolute;top:632px;width:410px;height:318px;border-radius:28px;background:#fffaf5;border:3px solid #ecdcd2;display:flex;flex-direction:column;align-items:center;padding-top:16px}
.flag{width:90px;height:90px;border-radius:50%;overflow:hidden;position:relative;margin-bottom:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.flag svg{position:absolute;top:0}
.dt{height:64px;line-height:64px;font-weight:900;color:var(--maroon);white-space:nowrap;display:inline-block;letter-spacing:.005em}
.dt .sx{font-size:.5em;position:relative;top:-.62em;margin-left:.04em;margin-right:.1em}
.wd{height:34px;line-height:34px;font-weight:800;font-size:30px;letter-spacing:.04em;color:#201618}
.tm{position:absolute;left:27px;right:27px;bottom:37px;height:68px;border-radius:17px;background:linear-gradient(180deg,var(--maroon2),var(--maroon));color:#fff;font-weight:800;text-align:center;line-height:68px;white-space:nowrap;border-bottom:3px solid rgba(60,5,18,.35)}
#bar{position:absolute;left:35px;top:975px;width:1930px;height:127px;border-radius:44px;background:#fffaf5;border:3px solid #ecdcd2;display:flex;align-items:center;padding:0 93px 0 190px}
.grp{display:flex;align-items:center;gap:30px}
.grp .l1{font-weight:600;font-size:21px;letter-spacing:.03em;color:#3b3234;text-transform:uppercase;line-height:1.25}
.grp .l2{font-weight:500;font-size:33px;line-height:1.15;color:#1f1719;white-space:nowrap}
.grp .l2 b{font-weight:800}
.grp .hd2{font-weight:800;font-size:39px;line-height:1.15;color:#1f1719}
.sep{width:2px;height:66px;background:var(--gold);margin:0 105px}
.join{margin-left:auto;height:90px;border-radius:45px;background:linear-gradient(180deg,var(--maroon2),var(--maroon));color:#fff;font-weight:700;font-size:37px;display:flex;align-items:center;gap:22px;padding:0 44px;white-space:nowrap;box-shadow:0 5px 12px rgba(80,10,25,.35)}

</style>

    </aside>

  var out={};

      else if(/^(base|maroon|gold|ink|g1|g2|accent2|col)$/.test(k))out[k]=/^#[0-9a-fA-F]{6}$/.test(v)?v:d;
      else if(k==='flag')out[k]=FLAGS[v]?v:d;

var MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
function parseSchedule(txt){
  var lines=String(txt||'').replace(/\r/g,'').split('\n'),mon=-1,year=0,items=[];
  var low=txt.toLowerCase();
  MONTHS.forEach(function(m,i){if(mon<0&&new RegExp('\\b'+m+'\\b').test(low))mon=i;});
  var ym=/\b(20\d\d)\b/.exec(txt);if(ym)year=+ym[1];
  function tidy(n){return n.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27bf\ufe0f\u200d]/gu,'').replace(/[*_~]/g,'').replace(/^[\s.\u2026:\-\u2013\u2014,]+/,'').replace(/[\s.\u2026:\-\u2013\u2014,]+$/,'').replace(/\s+/g,' ').slice(0,60);}
  for(var i=0;i<lines.length;i++){
    var m=/^\W*(\d+)\s*(?:st|nd|rd|th)?\s*week(?:\s+of\s+[A-Za-z]+)?(.*)$/i.exec(lines[i].trim());
    if(!m)continue;
    var name=tidy(m[2]);if(!name&&lines[i+1]&&!/week/i.test(lines[i+1])){name=tidy(lines[i+1]);i++;}
    if(name)items.push({week:+m[1],name:name});
  }
  return {mon:mon,year:year,items:items};
}
var SCHEME=[['Royal','Sky'],['Emerald','Sage'],['Plum','Lavender'],['Sunset','Peach'],['Teal','Gold'],['Maroon','Blush']];
function nthWeekday(y,mo,wd,n){var d=new Date(y,mo,1),add=(wd-d.getDay()+7)%7;d=new Date(y,mo,1+add+7*(n-1));return d.getMonth()===mo?d:null;}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function makeSchedule(txt){
  var P=parseSchedule(txt),now=new Date();
  if(!P.items.length)return {err:'I could not find any lines like "1st week ... Name".'};
  var mo=P.mon>=0?P.mon:(now.getMonth()+1)%12;
  var yr=P.year||(P.mon>=0&&P.mon<now.getMonth()?now.getFullYear()+1:(P.mon<0&&mo<now.getMonth()?now.getFullYear()+1:now.getFullYear()));
  flush();
  var base=cp(state),bm=/^(\d{4})-(\d\d)-(\d\d)$/.exec(base.d1.date),wd=bm?new Date(+bm[1],+bm[2]-1,+bm[3]).getDay():6;
  var bm2=/^(\d{4})-(\d\d)-(\d\d)$/.exec(base.d2.date),off=(bm&&bm2)?Math.round((new Date(+bm[1],+bm[2]-1,+bm[3])-new Date(+bm2[1],+bm2[2]-1,+bm2[3]))/864e5):1;
  var made=[],skipped=[],at=deck.i+1;
  var si0=0;SCHEME.forEach(function(c,i){var p=ACP.filter(function(q){return q[0]===c[0];})[0];if(p&&p[1].toLowerCase()===String(base.col.maroon).toLowerCase())si0=i+1;});
  P.items.forEach(function(it){
    var d=nthWeekday(yr,mo,wd,it.week);if(!d){skipped.push(it.name);return;}
    var f=cp(base);f.id=uid();
    f.left.name=it.name;f.left.place='';f.left.photo='';f.left.z=1;f.left.x=0;f.left.y=0;
    var cs=SCHEME[(made.length+skipped.length+si0)%SCHEME.length];
    acPreset(ACP.filter(function(p){return p[0]===cs[0];})[0])(f);
    var bp=BGP.filter(function(p){return p[0]===cs[1];})[0];if(bp)bgPreset(bp)(f);
    f.d1.date=ymd(d);f.d2.date=ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-off));
    deck.flyers.splice(at++,0,f);made.push(f);
  });
  if(!made.length)return {err:'None of those weeks fall inside that month.'};
  made.forEach(function(f){deck.i=deck.flyers.indexOf(f);bind();render();takeSnap();});
  deck.i=deck.flyers.indexOf(made[0]);bind();syncAll();render();drawStrip();updCounter();buildBar();pushHist();persist();

}

  if(/^fonts\./.test(path)||/^sty\.[A-Za-z0-9]+\.font$/.test(path))return (v===''||FONTMAP[v])?v:undefined;
  if(/^sty\.[A-Za-z0-9]+\.cs$/.test(path))return /^(none|uppercase|lowercase|capitalize)?$/.test(v)?v:undefined;
  if(/^sty\.[A-Za-z0-9]+\.wt$/.test(path))return /^(400|500|600|700|800|900)?$/.test(v)?v:undefined;
  return v;
}
function applyEdits(out){
  var n=0,set=out&&typeof out.set==='object'&&out.set?out.set:{};
  flush();
  Object.keys(set).forEach(function(p){var v=coerce(p,set[p]);if(v===undefined)return;
    var parts=p.split('.'),last=parts.pop(),o=state;
    for(var i=0;i<parts.length;i++){o=o[parts[i]];if(o==null)return;}
    if(o[last]!==v){o[last]=v;n++;if(/^fonts\./.test(p))needFont(v);}});
  var pr=out&&out.presets;
  if(pr&&typeof pr==='object'){
    if(pr.bg){var b=BGP.filter(function(p){return p[0].toLowerCase()===String(pr.bg).toLowerCase();})[0];if(b){bgPreset(b)(state);n++;}}
    if(pr.accent){var a=ACP.filter(function(p){return p[0].toLowerCase()===String(pr.accent).toLowerCase();})[0];if(a){acPreset(a)(state);n++;}}
  }
  if(n){applyFonts&&applyFonts();render();syncAll();buildBar();persist();pushHist();takeSnap();updateThumb(deck.i);}
  return n;
}

/* ---- chat panel ---- */
var chat=[];try{chat=JSON.parse(localStorage.getItem(CHK)||'[]').slice(-30);}catch(e){chat=[];}
var panel=$('#panel'),log,inp,pane;
function saveChat(){try{localStorage.setItem(CHK,JSON.stringify(chat.slice(-30)));}catch(e){}}
function build(){
  pane=document.createElement('section');pane.id='aiPane';pane.setAttribute('aria-label','AI assistant');
  pane.innerHTML='<div class="ahd"><span class="fname">AI assistant</span>'
   +'<button class="ico" type="button" id="aiSet" aria-label="AI settings" title="AI settings">'+icon('sliders')+'</button>'
   +'<button class="ico" type="button" id="aiClr" aria-label="Clear chat" title="Clear chat">'+icon('trash')+'</button>'
   +'<button class="ico" type="button" id="aiX" aria-label="Close" title="Close">'+icon('x')+'</button></div>'
   +'<div id="aiSetup"></div>'
   +'<div id="aiLog" role="log" aria-live="polite"></div>'
   +'<div id="aiChips"></div>'
   +'<form id="aiForm"><textarea id="aiIn" rows="1" placeholder="Tell me what to change..." aria-label="Message"></textarea><button class="btn primary" type="submit">Send</button></form>';
  panel.insertBefore(pane,panel.firstChild);
  log=$('#aiLog');inp=$('#aiIn');
  $('#aiX').addEventListener('click',function(){toggle(false);});
  $('#aiSet').addEventListener('click',settings);
  $('#aiClr').addEventListener('click',function(){chat=[];saveChat();draw0();});
  $('#aiForm').addEventListener('submit',function(e){e.preventDefault();send(inp.value);});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp.value);}});
  inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px';});
  var chips=[['Next week, Nov 7','Next Saturday is the meeting. Set the dates for it (Saturday in India, Friday in the US).'],['Emerald theme','Use the emerald colours with a sage background'],['New speaker','The word is by PASTOR HEMANTH AMARA, Maryland USA'],['Change Zoom','Change the Zoom meeting ID to ']];
  var ch=$('#aiChips');chips.forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c[0];b.addEventListener('click',function(){inp.value=c[1];inp.focus();});ch.appendChild(b);});
  draw0();
}
function draw0(){
  var ok=ready(),su=$('#aiSetup');
  su.style.display=ok?'none':'block';log.style.display=ok?'':'none';$('#aiChips').style.display=ok?'':'none';$('#aiForm').style.display=ok?'':'none';
  if(!ok){su.innerHTML='<p>Add your own AI key to let an assistant edit this flyer from plain words, such as "make it next Saturday with an emerald theme". Works with OpenRouter or any OpenAI-style address. The key stays in this browser.</p><button class="btn" type="button" id="aiGo">Set up AI</button>';$('#aiGo').addEventListener('click',settings);return;}
  log.textContent='';
  if(!chat.length)add('note','Ask me to change names, dates and times, Zoom details, colours or fonts. I cannot add photos; use the Photos tool for those.');
  chat.forEach(function(m){add(m.r,m.t,true);});
  log.scrollTop=log.scrollHeight;
}
function add(kind,text,quiet){var d=document.createElement('div');d.className='m '+kind;d.textContent=text;log.appendChild(d);if(!quiet)log.scrollTop=log.scrollHeight;return d;}
function toggle(on){
  if(!pane)build();
  panel.classList.toggle('ai-on',on);
  var b=$('#aiBtn');if(b)b.setAttribute('aria-pressed',String(on));
  if(on){selectTarget(null);panel.classList.add('ai-on');if(ready())setTimeout(function(){inp.focus();},50);}
}
var busyAI=false;
function send(text){
  text=String(text||'').trim();if(!text||busyAI||!ready())return;
  busyAI=true;inp.value='';inp.style.height='auto';
  chat.push({r:'me',t:text});add('me',text);
  var SP=parseSchedule(text);
  if(SP.items.length>=2){
    var R=makeSchedule(text),msg=R.err?R.err:('I made '+R.n+' flyers for '+R.month.charAt(0).toUpperCase()+R.month.slice(1)+' '+R.year+', one per week, from the current flyer as the template, each in its own colour set. Each has that week\'s speaker in the left card; add the photos next.'+(R.skipped.length?' Skipped (no such week): '+R.skipped.join(', ')+'.':''));
    add('bot',msg);chat.push({r:'bot',t:msg});saveChat();busyAI=false;return;
  }
  var wait=add('bot','Thinking...');
  var hist=chat.slice(-9,-1).map(function(m){return {role:m.r==='me'?'user':'assistant',content:m.t};});
  var msgs=[{role:'system',content:systemPrompt()}].concat(hist,[{role:'user',content:text+'\n\nCurrent flyer:\n'+JSON.stringify(cleanFlyer())}]);
  ask(msgs).then(function(out){
    var n=applyEdits(out),reply=String(out&&out.reply||(n?'Done.':'I did not change anything.')).slice(0,600);
    wait.textContent=reply;
    if(n){var c=document.createElement('div');c.className='chg';c.textContent=n+(n===1?' change':' changes')+' applied.';
      var u=document.createElement('button');u.type='button';u.textContent='Undo';u.addEventListener('click',function(){undo();u.disabled=true;c.textContent='Undone.';});c.appendChild(u);wait.appendChild(c);}
    chat.push({r:'bot',t:reply});saveChat();
  }).catch(function(e){wait.className='m bot bad';wait.textContent=(e&&e.kind)?e.message:'Something went wrong. Try again.';chat.pop();saveChat();})
  .then(function(){busyAI=false;log.scrollTop=log.scrollHeight;});
}
function settings(){
  var s=getAI(),dlg=document.createElement('dialog');dlg.className='aid';
  dlg.innerHTML='<form method="dialog" id="aiF"><h2>AI settings</h2><p class="nt">Stored in this browser only, not in templates or downloads. What you type to the assistant, and your flyer text, is sent to the address below.</p>'
   +'<label><span>Provider</span><select id="aiP"><option value="">Custom</option>'+PROVIDERS.map(function(p,i){return '<option value="'+i+'"'+(p[1]===s.url?' selected':'')+'>'+esc(p[0])+'</option>';}).join('')+'</select></label>'
   +'<label><span>Address</span><input id="aiU" value="'+esc(s.url)+'" autocomplete="off" spellcheck="false"></label>'
   +'<label><span>API key</span><input id="aiKey" type="password" value="'+esc(s.key)+'" autocomplete="off" placeholder="Paste your key"></label>'
   +'<label><span>Model</span><input id="aiM" value="'+esc(s.model)+'" autocomplete="off" spellcheck="false"></label>'
   +'<label><span>Backup model (used if the first fails, optional)</span><input id="aiB" value="'+esc(s.backup)+'" autocomplete="off" spellcheck="false"></label>'
   +'<p class="st" id="aiSt" role="status"></p><div class="acts"><button type="button" class="btn" id="aiT">Test connection</button><button type="button" class="btn" id="aiC">Close</button><button type="submit" class="btn primary">Save</button></div></form>';
  document.body.appendChild(dlg);dlg.showModal();
  var q=function(i){return dlg.querySelector(i);},st=q('#aiSt');
  var rd=function(){return {url:q('#aiU').value,key:q('#aiKey').value,model:q('#aiM').value,backup:q('#aiB').value};};
  function close(){dlg.close();dlg.remove();}
  q('#aiP').addEventListener('change',function(){var p=PROVIDERS[this.value];if(p){q('#aiU').value=p[1];q('#aiM').value=p[2];}});
  q('#aiC').addEventListener('click',close);
  dlg.addEventListener('cancel',function(e){e.preventDefault();close();});
  q('#aiF').addEventListener('submit',function(e){e.preventDefault();saveAI(rd());close();if(pane)draw0();});
  q('#aiT').addEventListener('click',function(){saveAI(rd());st.dataset.k='';st.textContent='Testing...';
    chatOnce([{role:'user',content:'Reply with the single word OK.'}],getAI().model,64).then(function(r){st.dataset.k='ok';st.textContent='Connected. '+getAI().model+' replied: '+r.slice(0,40);},function(e){st.dataset.k='bad';st.textContent=e.message||'Could not connect.';});});
}
$('#aiBtn').addEventListener('click',function(){toggle(!panel.classList.contains('ai-on'));});
/* picking any other tool or clicking the flyer returns to the normal options */
var _sel=selectTarget;selectTarget=function(k){if(k&&panel.classList.contains('ai-on')){panel.classList.remove('ai-on');var b=$('#aiBtn');if(b)b.setAttribute('aria-pressed','false');}return _sel(k);};
window.__aiToggle=toggle;
})();

/* ---------- live link to the server: Claude / a bot change this flyer while it is open ---------- */
(function(){
if(window.top!==window||!/^https?:$/.test(location.protocol))return;
var LK='agiwm-flyer-live',CID=Math.random().toString(36).slice(2,10);
var btn=$('#liveBtn'),box=null,es=null,pollT=0,sendT=0,remote=false,lastVer=-1,lastSrv={},feed=[],status='off',key='';
function store(){try{return JSON.parse(localStorage.getItem(LK)||'{}');}catch(e){return {};}}
function saveStore(o){try{localStorage.setItem(LK,JSON.stringify(o));}catch(e){}}
key=store().key||'';
var m=/[#&]live=([^&]+)/.exec(location.hash||'');
if(m){key=decodeURIComponent(m[1]);saveStore({key:key,on:true});try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
btn.classList.add('show');
function setS(s,label){status=s;btn.setAttribute('data-s',s);btn.querySelector('span').textContent=label;}
function api(p,opt){return fetch(p+(p.indexOf('?')<0?'?':'&')+'k='+encodeURIComponent(key),opt);}
function t2(ts){var d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function flyerForServer(){
  var f=cp(state);delete f.id;delete f.logo;
  [['left','photo'],['right','photo'],['bg','img']].forEach(function(p){var v=f[p[0]][p[1]];var o=lastSrv[p[0]+'.'+p[1]];if(v&&v===o)f[p[0]][p[1]]='@keep';});
  return f;
}
function noteSrv(){[['left','photo'],['right','photo'],['bg','img']].forEach(function(p){lastSrv[p[0]+'.'+p[1]]=state[p[0]][p[1]];});}
function applyRemote(fl,entry){
  remote=true;
  try{
    flush();
    var id=state.id,c=cleanse(fl,DEF);c.id=id;c.logo=state.logo||DEF.logo;
    deck.flyers[deck.i]=c;bind();
    Object.keys(c.fonts||{}).forEach(function(k){if(c.fonts[k])needFont(c.fonts[k]);});
    render();syncAll();buildBar();pushHist();persist();takeSnap();updateThumb(deck.i);noteSrv();
  }finally{remote=false;}
  btn.classList.remove('ping');void btn.offsetWidth;btn.classList.add('ping');
  if(entry)toast(entry.by+': '+entry.text.slice(0,90));
}
function onState(d,fromEvent){
  if(d.origin===CID)return;
  if(d.version<=lastVer&&fromEvent)return;
  lastVer=d.version;
  if(d.entry)feed=[d.entry].concat(feed).slice(0,40);else if(d.feed)feed=d.feed;
  if(d.version>0||fromEvent)applyRemote(d.flyer||{},fromEvent?d.entry:null);
  drawFeed();
}
function connect(){
  disconnect(true);
  if(!key){setS('off','Go live');return;}
  setS('wait','Connecting...');
  api('/api/state').then(function(r){
    if(r.status===401)throw new Error('The live key was not accepted.');
    if(!r.ok)throw new Error('No live server at this address.');return r.json();})
  .then(function(d){
    lastVer=d.version;feed=d.feed||[];
    if(d.version>0){applyRemote(d.flyer,null);}else{sendNow(true);}
    setS('on','Live');drawFeed();
    es=new EventSource('/api/live?k='+encodeURIComponent(key));
    es.onmessage=function(e){try{onState(JSON.parse(e.data),true);}catch(x){}};
    es.onerror=function(){setS('wait','Reconnecting...');};
    es.onopen=function(){setS('on','Live');};
  }).catch(function(e){setS('bad','Not live');box&&drawFeed(e.message);});
}
function disconnect(keep){if(es){es.close();es=null;}clearTimeout(sendT);if(!keep){setS('off','Go live');}}
function sendNow(first){
  if(!key||status==='bad')return;
  clearTimeout(sendT);
  api('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({flyer:flyerForServer(),client:CID,text:first?null:null})})
  .then(function(r){return r.ok?r.json():null;}).then(function(d){if(d){lastVer=d.version;noteSrv();}}).catch(function(){});
}
/* local edits go to the server (and so to Claude) */
var _persist=persist;persist=function(){_persist();if(!remote&&es){clearTimeout(sendT);sendT=setTimeout(function(){sendNow(false);},700);}};

function drawFeed(msg){
  if(!box){box=document.createElement('div');box.id='liveFeed';document.body.appendChild(box);
    document.addEventListener('click',function(e){if(box.classList.contains('on')&&!box.contains(e.target)&&!btn.contains(e.target))box.classList.remove('on');});}
  var h='<h3>Live link</h3>';
  if(msg)h+='<p class="nt" style="color:#ff8b8e">'+esc(msg)+'</p>';
  else if(!key)h+='<p class="nt">Connect this page to the live flyer: what Claude (or the WhatsApp bot) changes shows up here at once, and your own edits are visible to them. Paste the key from your link.</p>';
  else h+='<p class="nt">'+(status==='on'?'Connected. Instructions from Claude appear here as they arrive.':'Not connected right now.')+'</p>';
  if(key&&feed.length)h+=feed.slice(0,12).map(function(e){return '<div class="ent"><b>'+esc(e.by)+'</b> '+esc(e.text)+'<small>'+t2(e.t)+'</small></div>';}).join('');
  else if(key)h+='<div class="ent"><small>No instructions yet.</small></div>';
  h+='<div class="acts">'+(key?'<button class="btn" type="button" id="lvOff">Disconnect</button>':'')+'<button class="btn" type="button" id="lvKey">'+(key?'Change key':'Enter key')+'</button></div>';
  box.innerHTML=h;
  var k=box.querySelector('#lvKey');if(k)k.addEventListener('click',askKey);
  var o=box.querySelector('#lvOff');if(o)o.addEventListener('click',function(){key='';saveStore({});disconnect(false);drawFeed();});
}
function askKey(){
  var v=window.prompt('Paste the live key (the secret part of your connector link)','');
  if(v&&v.trim()){key=v.trim();saveStore({key:key,on:true});connect();}
}
btn.addEventListener('click',function(e){e.stopPropagation();drawFeed();box.classList.toggle('on');});
if(key)connect();else setS('off','Go live');
})();

/* ---------- boot ---------- */
try{
  var saved=localStorage.getItem('agiwm-flyer-v2');
  if(saved){var d0=cleanseDeck(JSON.parse(saved));d0.flyers.forEach(function(f){if(!f.logo)f.logo=DEF.logo;});deck=d0;bind();}
  else{var old=localStorage.getItem('agiwm-flyer-v1');if(old){deck=cleanseDeck(JSON.parse(old));deck.flyers.forEach(function(f){if(!f.logo)f.logo=DEF.logo;});bind();}}
}catch(e){}
$('#deckName').value=deck.name;
syncAll();rescale();render();
function boot2(){snapAll();drawStrip();updCounter();if(!hist.length)pushHist();rescale();placeSel();}
boot2();
try{if(!sessionStorage.getItem('agiwm-hint')){sessionStorage.setItem('agiwm-hint','1');setTimeout(function(){toast('Click a text to select it, click again to type on the flyer.');},900);}}catch(e){}
if(document.fonts&&document.fonts.load){
  Promise.all(['900 100px Montserrat','800 30px Montserrat','600 30px Montserrat','500 30px Montserrat','900 100px "Playfair Display"','100px "Great Vibes"'].map(function(f){return document.fonts.load(f,'Aa');}))
   .then(function(){boot2();},function(){}).then(function(){document.fonts.ready.then(boot2);});
}
window.addEventListener('load',boot2);
})();
